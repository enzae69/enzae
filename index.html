<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Sudoku Multiplayer</title>

<style>
  body {
    font-family: Arial;
    text-align: center;
    background: #f4f4f4;
  }

  #sudoku {
    display: grid;
    grid-template-columns: repeat(9, 45px);
    grid-template-rows: repeat(9, 45px);
    margin: 20px auto;
    width: max-content;
  }

  #sudoku input {
    width: 45px;
    height: 45px;
    text-align: center;
    font-size: 20px;
    border: 1px solid #999;
  }

  /* Dicke Linien */
  #sudoku input:nth-child(3n) {
    border-right: 3px solid black;
  }

  #sudoku input:nth-child(n+19):nth-child(-n+27),
  #sudoku input:nth-child(n+46):nth-child(-n+54) {
    border-bottom: 3px solid black;
  }

  .given {
    background: #ddd;
    font-weight: bold;
  }

  button {
    padding: 10px 20px;
    font-size: 16px;
    margin-top: 20px;
  }

  #status {
    margin-top: 15px;
    font-size: 18px;
  }

</style>
</head>

<body>

<h1>Sudoku Multiplayer 🔥</h1>

<div id="sudoku"></div>

<button id="finishBtn">Fertig</button>

<div id="status"></div>

<script type="module" src="main.js"></script>
</body>
</html>
