<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sudoku Multiplayer</title>
  <style>
    #sudoku {
      display: grid;
      grid-template-columns: repeat(9, 40px);
      grid-template-rows: repeat(9, 40px);
      gap: 2px;
      width: max-content;
      margin: 20px auto;
    }

    input {
      width: 40px;
      height: 40px;
      text-align: center;
      font-size: 20px;
    }
  </style>
</head>
<body>

  <h1 style="text-align:center;">Sudoku Multiplayer</h1>
  <div id="sudoku"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
