<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Sudoku Multiplayer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f4f4;
    }

    #sudoku {
      display: grid;
      grid-template-columns: repeat(9, 40px);
      grid-template-rows: repeat(9, 40px);
      gap: 2px;
      width: max-content;
      margin: 20px auto;
    }

    #sudoku input {
      width: 40px;
      height: 40px;
      text-align: center;
      font-size: 20px;
      border: 1px solid #999;
    }

    /* Dicke Linien für 3x3 Blöcke */
    #sudoku input:nth-child(3n) {
      border-right: 2px solid black;
    }

    #sudoku input:nth-child(n+19):nth-child(-n+27),
    #sudoku input:nth-child(n+46):nth-child(-n+54) {
      border-bottom: 2px solid black;
    }

    h1 {
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>Sudoku Multiplayer 🔥</h1>
  <div id="sudoku"></div>

  <script type="module" src="main.js"></script>

</body>
</html>
